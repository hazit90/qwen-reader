name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build the app
        run: CODESIGN_IDENTITY=- ./scripts/build.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: Qwen-Reader
          path: build/*.zip
